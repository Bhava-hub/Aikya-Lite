version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: pip install -r requirements.txt
      - run:
          name: Lint
          command: ruff check .
      - run:
          name: Run tests
          command: python3 -m pytest -v

workflows:
  build-and-test:
    jobs:
      - test